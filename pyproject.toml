[project]
name = "gameboy-rl"
version = "0.1.0"
description = "PPO on Pokemon Red (PWhiddy's v2 env, wrapped) with training-health monitoring and a self-terminating RunPod job"
requires-python = ">=3.12,<3.13"
# Pinned to the same minor lines as v2/requirements.txt (PWhiddy's tested set).
dependencies = [
    "pyboy>=2.4,<2.5",
    "stable-baselines3>=2.3.2,<2.4",
    "gymnasium==0.29.1",
    "numpy>=2.1,<2.2",
    "torch==2.14.1",  # exact: runpod/Dockerfile installs the same version from the cu126 index
    "scikit-image>=0.24,<0.25",
    "einops>=0.8,<0.9",
    "mediapy>=1.2,<1.3",
    "matplotlib>=3.9,<3.10",
    "websockets>=13.1,<14",
    "tensorboard>=2.18,<2.19",
    "pillow>=11",
    "pydantic-settings>=2.4",
    "mlflow-skinny>=2.17",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gameboy-rl = "gameboy_rl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gameboy_rl"]

# Local + CI use CPU torch; runpod/Dockerfile swaps in the cu126 wheel of the same version after `uv sync`.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["rom: needs roms/pokemon_red_version.gb (skipped when absent)"]
